[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scalp_bot"
version = "0.1.0"
description = "Smart Money Concepts scalping signal engine + FundingPips backtester (Phase 1: core engine)"
readme = "README.md"
requires-python = ">=3.11"
# Phase 1 (config + domain + signal_engine + tests) is pure standard library.
# pandas / numpy / pyarrow are only needed from Phase 2 (data extraction & backtest) onward.
dependencies = []

[project.optional-dependencies]
data = ["pandas>=2.0", "numpy>=1.24", "pyarrow>=14.0"]
bot = ["python-telegram-bot>=21.0", "APScheduler>=3.10"]
mt5 = ["MetaTrader5>=5.0"]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["config", "domain", "signal_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
