name: Shared Host Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-host-scheduler
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger private one-shot bot runs
        env:
          SCHEDULER_URL: ${{ secrets.CONSENSUS_SCHEDULER_URL }}
          SCHEDULER_TOKEN: ${{ secrets.CONSENSUS_SCHEDULER_TOKEN }}
        run: |
          set -eu
          test -n "$SCHEDULER_URL"
          test -n "$SCHEDULER_TOKEN"
          for task in consensus edge; do
            curl \
              --fail \
              --silent \
              --show-error \
              --max-time 20 \
              --retry 2 \
              --request POST \
              --header "X-Consensus-Scheduler: $SCHEDULER_TOKEN" \
              --output /dev/null \
              "$SCHEDULER_URL?task=$task"
          done
